# Railway config for service: web
# Link: railway link -p d43bf9da-63b9-4887-b363-76bd02669240 -e production -s web
# Deploy: railway up --service web --detach
# Domain (AFTER first successful up — up does NOT assign a public URL):
#   railway domain --service web --port 3000

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/web.Dockerfile"

[deploy]
healthcheckPath = "/api/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
