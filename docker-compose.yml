name: forge

services:
  postgres:
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forge"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [backend]

  minio:
    image: forge/minio:local
    pull_policy: never
    build:
      context: .
      dockerfile: infra/docker/minio.Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: forge
      MINIO_ROOT_PASSWORD: forge-dev-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [backend]

  createbucket:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 forge forge-dev-secret
        mc mb --ignore-existing local/forge
        mc anonymous set none local/forge
        mc stat local/forge
    restart: "no"
    networks: [backend]

  web:
    image: forge/web:local
    pull_policy: never
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:forge@postgres:5432/forge
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: forge
      S3_SECRET_KEY: forge-dev-secret
      S3_BUCKET: forge
      S3_FORCE_PATH_STYLE: "true"
      SESSION_SECRET: local-container-session-secret-change-before-deploy
      DEMO_ACCESS_CODE: forge-local
      ADAPTER_OPENAI: fake
      ADAPTER_CODEX: fake
      ADAPTER_OCTEN: fake
      ADAPTER_COMPOSIO: fake
      ADAPTER_ZENDESK: fake
      ADAPTER_SANDBOX: docker
      AUTH_MODE: dev
    ports:
      - "127.0.0.1:${FORGE_WEB_PORT:-3100}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [frontend, backend]

  worker:
    image: forge/worker:local
    pull_policy: never
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:forge@postgres:5432/forge
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: forge
      S3_SECRET_KEY: forge-dev-secret
      S3_BUCKET: forge
      S3_FORCE_PATH_STYLE: "true"
      ADAPTER_OPENAI: fake
      ADAPTER_CODEX: fake
      ADAPTER_OCTEN: fake
      ADAPTER_COMPOSIO: fake
      ADAPTER_ZENDESK: fake
      ADAPTER_SANDBOX: docker
      AUTH_MODE: dev
      WORKER_POLL_INTERVAL_MS: 1000
      JOB_LEASE_MS: 30000
      WORKER_HEALTH_PORT: 3001
      FOUNDRY_URL: http://foundry:3002
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      foundry:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks: [backend]

  foundry:
    image: forge/foundry:local
    pull_policy: never
    build:
      context: .
      dockerfile: infra/docker/foundry.Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      FOUNDRY_PORT: 3002
      ADAPTER_OPENAI: fake
      ADAPTER_CODEX: fake
      ADAPTER_OCTEN: fake
      ADAPTER_COMPOSIO: fake
      ADAPTER_ZENDESK: fake
      ADAPTER_SANDBOX: docker
      AUTH_MODE: dev
      FAKE_CODEX_PACE_MS: 6000
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  sandbox-runner:
    image: forge/sandbox-runner:local
    pull_policy: never
    build:
      context: .
      dockerfile: infra/docker/sandbox.Dockerfile
    profiles: ["sandbox"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1

  mailpit:
    image: axllent/mailpit@sha256:b868afa176bfd6cce2323ea316cd99ccad77915e51e595748f6d786700ecf109
    profiles: ["dev"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    networks: [backend]

volumes:
  pgdata:
  miniodata:

networks:
  frontend:
  backend:
