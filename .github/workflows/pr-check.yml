# PR smoke: unit tests + typecheck only.
# No deploy. No secrets required. Safe for a public repository.

name: PR check

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-typecheck:
    name: format · lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Full verify (format + lint + typecheck + test) — optional extra gate.
      # Kept after typecheck/test so failures surface faster on the cheap steps.
      - name: Verify (format + lint + typecheck + test)
        run: pnpm verify
